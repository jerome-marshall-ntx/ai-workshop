<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Skin (HTML + CSS)</title>
    <style>
        /* 
            THE SKIN (CSS)
            This CSS provides the "skin" and "clothes" for our skeleton.
            It handles layout, colors, typography, and visual feedback.
        */

        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f6fa;
            --text-color: #2c3e50;
            --accent-color: #e74c3c;
            --success-color: #2ecc71;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        p {
            color: #7f8c8d;
            margin-top: 0.5rem;
        }

        section {
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary-color);
            padding-left: 0.8rem;
        }

        /* Counter Styling */
        #counter-display {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
            color: var(--text-color);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #btn-reset {
            background-color: #95a5a6;
        }

        #btn-decrement {
            background-color: var(--accent-color);
        }

        /* Task List Styling */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: var(--secondary-color);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
        }

        li:hover {
            background-color: #dcdde1;
        }

        /* Visual state for completed items (won't toggle without JS) */
        li.completed {
            text-decoration: line-through;
            opacity: 0.6;
            background-color: #e8f8f5;
            border-left: 4px solid var(--success-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #bdc3c7;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Task Counter App</h1>
            <p>HTML + CSS (Skin)</p>
        </header>

        <main>
            <!-- Counter Section -->
            <section>
                <h2>Counter</h2>
                <div id="counter-display">0</div>
                <div class="button-group">
                    <button id="btn-decrement">- Decrease</button>
                    <button id="btn-reset">Reset</button>
                    <button id="btn-increment">+ Increase</button>
                </div>
            </section>

            <!-- Task List Section -->
            <section>
                <h2>My Tasks</h2>
                <p style="font-size: 0.8rem; margin-bottom: 10px;">(Buttons look nice but still don't work!)</p>
                <ul id="task-list">
                    <li class="completed">Learn HTML Structure</li>
                    <li>Master CSS Styling</li>
                    <li>Understand JavaScript Logic</li>
                </ul>
                
                <div class="input-group">
                    <input type="text" placeholder="Add a new task..." id="task-input">
                    <button id="btn-add">Add</button>
                </div>
            </section>
        </main>

        <footer>
            <p>Step 2: HTML + CSS (Structure + Skin)</p>
        </footer>
    </div>
</body>
</html>
