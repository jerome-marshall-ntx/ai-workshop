<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Skeleton (HTML Only)</title>
</head>
<body>
    <!-- 
        THE SKELETON (HTML)
        This file represents the "skeleton" of a webpage.
        It provides structure and meaning (headings, paragraphs, lists)
        but lacks style (skin) and interactivity (muscles/brain).
    -->

    <header>
        <h1>Task Counter App</h1>
        <p>A simple demonstration of web technologies.</p>
    </header>

    <main>
        <!-- Counter Section -->
        <section>
            <h2>Counter</h2>
            <div id="counter-display">0</div>
            <div>
                <button id="btn-decrement">- Decrease</button>
                <button id="btn-reset">Reset</button>
                <button id="btn-increment">+ Increase</button>
            </div>
        </section>

        <!-- Task List Section -->
        <section>
            <h2>My Tasks</h2>
            <p>Click items to mark as done (functionality requires JS):</p>
            <ul id="task-list">
                <li>Learn HTML Structure</li>
                <li>Master CSS Styling</li>
                <li>Understand JavaScript Logic</li>
            </ul>
            
            <!-- Simple input for new task (visual only in this version) -->
            <div>
                <input type="text" placeholder="Add a new task..." id="task-input">
                <button id="btn-add">Add Task</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Step 1: HTML Structure (Skeleton)</p>
    </footer>
</body>
</html>
